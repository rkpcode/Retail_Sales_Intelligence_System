<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Profit Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; padding-top: 30px; }
        .container { max-width: 800px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-label { font-weight: 600; }
        .btn-primary { background-color: #0d6efd; border: none; padding: 10px 20px; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 5px; text-align: center; font-size: 1.5em; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4">Retail Profitability Predictor</h2>
        
        <form action="/predictdata" method="post">
            <div class="row">
                <!-- Numerical Inputs -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">Sales ($)</label>
                    <input class="form-control" type="number" name="sales" step="0.01" required />
                </div>
                <!-- PROFIT INPUT REMOVED -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">Quantity</label>
                    <input class="form-control" type="number" name="quantity" required />
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Discount (0.0 to 1.0)</label>
                    <input class="form-control" type="number" name="discount" step="0.01" min="0" max="1" required />
                    <small class="text-muted">Higher discounts usually reduce profit.</small>
                </div>

                <!-- Date Inputs -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">Order Date</label>
                    <input class="form-control" type="date" name="order_date" required />
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Ship Date</label>
                    <input class="form-control" type="date" name="ship_date" required />
                </div>

                <!-- Categorical Inputs -->
                <div class="col-md-4 mb-3">
                    <label class="form-label">Region</label>
                    <select class="form-control" name="region" required>
                        <option value="South">South</option>
                        <option value="West">West</option>
                        <option value="Central">Central</option>
                        <option value="East">East</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Segment</label>
                    <select class="form-control" name="segment" required>
                        <option value="Consumer">Consumer</option>
                        <option value="Corporate">Corporate</option>
                        <option value="Home Office">Home Office</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Ship Mode</label>
                    <select class="form-control" name="ship_mode" required>
                        <option value="Second Class">Second Class</option>
                        <option value="Standard Class">Standard Class</option>
                        <option value="First Class">First Class</option>
                        <option value="Same Day">Same Day</option>
                    </select>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label class="form-label">Category</label>
                    <select class="form-control" name="category">
                        <option value="Furniture">Furniture</option>
                        <option value="Office Supplies">Office Supplies</option>
                        <option value="Technology">Technology</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Sub Category</label>
                    <select class="form-control" name="sub_category">
                        <option value="Bookcases">Bookcases</option>
                        <option value="Chairs">Chairs</option>
                        <option value="Labels">Labels</option>
                        <option value="Tables">Tables</option>
                        <option value="Storage">Storage</option>
                        <option value="Furnishings">Furnishings</option>
                        <option value="Phones">Phones</option>
                        <option value="Binders">Binders</option>
                        <option value="Appliances">Appliances</option>
                        <option value="Paper">Paper</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Envelopes">Envelopes</option>
                        <option value="Fasteners">Fasteners</option>
                        <option value="Supplies">Supplies</option>
                        <option value="Machines">Machines</option>
                        <option value="Copiers">Copiers</option>
                    </select>
                </div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Predict Profitability</button>
            </div>
        </form>

        {% if results %}
        <div class="result-box {{ alert_class }}">
            Prediction: {{ results }}
        </div>
        {% endif %}
    </div>
</body>
</html>
